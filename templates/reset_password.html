<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        p {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            color: #b91c1c;
            margin-top: 14px;
        }

        .flash {
            color: #b91c1c;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>
        <p>Enter your new password below.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form id="resetForm" method="POST" action="{{ url_for('reset_password') }}">
            <input type="hidden" name="access_token" id="access_token">
            <input type="hidden" name="refresh_token" id="refresh_token">

            <label for="password">New Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
                autocomplete="new-password"
                placeholder="At least 8 characters"
            >

            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                minlength="8"
                required
                autocomplete="new-password"
                placeholder="Re-enter your password"
            >

            <button type="submit" id="submitButton">Update Password</button>
            <p id="message" role="alert"></p>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const accessToken = params.get("access_token");
        const refreshToken = params.get("refresh_token");
        const recoveryType = params.get("type");

        const accessInput = document.getElementById("access_token");
        const refreshInput = document.getElementById("refresh_token");
        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        if (
            accessToken &&
            refreshToken &&
            recoveryType === "recovery"
        ) {
            accessInput.value = accessToken;
            refreshInput.value = refreshToken;
        } else {
            message.textContent =
                "Recovery link is missing or invalid. Request a new reset email.";
            button.disabled = true;
        }

        form.addEventListener("submit", function (event) {
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirm_password").value;

            if (password.length < 8) {
                event.preventDefault();
                message.textContent =
                    "Password must contain at least 8 characters.";
            } else if (password !== confirmPassword) {
                event.preventDefault();
                message.textContent = "Passwords do not match.";
            }
        });
    </script>
</body>
</html>
