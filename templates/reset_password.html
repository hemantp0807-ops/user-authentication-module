
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | User Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin: 0 0 10px;
            color: #111827;
        }

        p {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 14px;
            color: #b91c1c;
            overflow-wrap: anywhere;
        }

        #message.success {
            color: #15803d;
        }

        .flash {
            color: #b91c1c;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .below {
            margin-top: 18px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Reset Password</h2>
        <p>Enter your new password below.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form
            id="resetForm"
            method="POST"
            action="{{ url_for('reset_password') }}"
            hidden
        >
            <input
                type="hidden"
                name="access_token"
                id="access_token"
            >

            <input
                type="hidden"
                name="refresh_token"
                id="refresh_token"
            >

            <label for="password">New Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
                autocomplete="new-password"
                placeholder="At least 8 characters"
            >

            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                minlength="8"
                required
                autocomplete="new-password"
                placeholder="Re-enter your password"
            >

            <button type="submit" id="submitButton">
                Update Password
            </button>
        </form>

        <p id="message" role="alert" aria-live="polite">
            Checking your password recovery link...
        </p>

        <p class="below">
            <a href="{{ url_for('login') }}">Back to Login</a>
        </p>
    </div>

    <script>
        (() => {
            const form = document.getElementById("resetForm");
            const accessInput = document.getElementById("access_token");
            const refreshInput = document.getElementById("refresh_token");
            const passwordInput = document.getElementById("password");
            const confirmInput = document.getElementById("confirm_password");
            const message = document.getElementById("message");
            const button = document.getElementById("submitButton");

            function showMessage(text, success = false) {
                message.textContent = text;
                message.classList.toggle("success", success);
            }

            // Supabase commonly returns recovery tokens in the URL fragment.
            const hashParams = new URLSearchParams(
                window.location.hash.startsWith("#")
                    ? window.location.hash.substring(1)
                    : window.location.hash
            );

            // Also support query parameters if the configured flow supplies them.
            const queryParams = new URLSearchParams(window.location.search);

            const accessToken =
                hashParams.get("access_token") ||
                queryParams.get("access_token");

            const refreshToken =
                hashParams.get("refresh_token") ||
                queryParams.get("refresh_token");

            const recoveryType =
                hashParams.get("type") ||
                queryParams.get("type");

            const authError =
                hashParams.get("error_description") ||
                queryParams.get("error_description");

            if (authError) {
                showMessage(
                    "This recovery link is invalid or expired. Please request a new password reset email."
                );
                return;
            }

            if (
                !accessToken ||
                !refreshToken ||
                recoveryType !== "recovery"
            ) {
                showMessage(
                    "The recovery link is missing, invalid, or expired. Please request a new reset email."
                );
                return;
            }

            accessInput.value = accessToken;
            refreshInput.value = refreshToken;

            // Remove tokens from the visible URL after capturing them.
            // Keep them in memory until the form is submitted.
            if (window.history && window.history.replaceState) {
                window.history.replaceState(
                    null,
                    document.title,
                    window.location.pathname + window.location.search
                );
            }

            form.hidden = false;
            showMessage("Recovery link verified in your browser.", true);

            form.addEventListener("submit", function (event) {
                const password = passwordInput.value;
                const confirmPassword = confirmInput.value;

                if (password.length < 8) {
                    event.preventDefault();
                    showMessage(
                        "Password must contain at least 8 characters."
                    );
                    return;
                }

                if (password !== confirmPassword) {
                    event.preventDefault();
                    showMessage("Passwords do not match.");
                    return;
                }

                if (!accessInput.value || !refreshInput.value) {
                    event.preventDefault();
                    showMessage(
                        "Your recovery session is missing. Request a new reset email."
                    );
                    return;
                }

                button.disabled = true;
                button.textContent = "Updating Password...";
                showMessage("Updating your password...", true);
            });
        })();
    </script>
</body>
</html>
