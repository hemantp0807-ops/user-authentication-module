{% extends "base.html" %}
{% block title %}Choose Password | User Portal{% endblock %}
{% block content %}
<section class="card">
  <h1>Choose a new password</h1>
  <form method="post">
    <label>New password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
    <button class="button full" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
