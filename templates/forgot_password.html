{% extends "base.html" %}
{% block title %}Forgot Password | User Portal{% endblock %}
{% block content %}
<section class="card">
  <h1>Reset your password</h1>
  <p class="muted">Enter your account email. If it exists, a reset link will be generated.</p>
  <form method="post">
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <button class="button full" type="submit">Send reset link</button>
  </form>
</section>
{% endblock %}
