
{% extends "base.html" %}

{% block title %}Login | User Portal{% endblock %}

{% block content %}
<section class="card">
    <h1>Welcome back</h1>

    <p class="muted">
        Sign in with your registered email address.
    </p>

    <form method="post" id="loginForm">
        <label for="email">Email address</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="100"
            required
            autocomplete="email"
            placeholder="you@example.com"
        >

        <label for="password">Password</label>
        <div style="position: relative;">
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="Enter your password"
                style="width: 100%; padding-right: 75px;"
            >

            <button
                type="button"
                id="togglePassword"
                style="position: absolute; right: 8px; top: 50%;
                       transform: translateY(-50%); border: none;
                       background: transparent; color: #2563eb;
                       cursor: pointer; padding: 5px;"
                aria-label="Show password"
            >Show</button>
        </div>

        <button class="button full" type="submit" id="loginButton">
            Login
        </button>
    </form>

    <p class="below">
        <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
    </p>

    <p class="below">
        New here?
        <a href="{{ url_for('register') }}">Create an account</a>
    </p>

    <p class="below muted">
        If you just registered, confirm your email before logging in.
    </p>
</section>

<script>
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("togglePassword");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");

    toggleButton.addEventListener("click", function () {
        const showingPassword = passwordInput.type === "password";

        passwordInput.type = showingPassword ? "text" : "password";
        toggleButton.textContent = showingPassword ? "Hide" : "Show";
        toggleButton.setAttribute(
            "aria-label",
            showingPassword ? "Hide password" : "Show password"
        );
    });

    loginForm.addEventListener("submit", function () {
        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";
    });
</script>
{% endblock %}
